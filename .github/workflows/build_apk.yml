name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android folder if missing
        run: flutter create --platforms=android --org com.alfaham --project-name alfaham_box .

      - name: Patch AndroidManifest (internet, http, TV launcher, app name) and package name
        run: |
          python3 - <<'PY'
          import re, glob
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if 'android.hardware.touchscreen' not in s:
              s = s.replace('<application', '<uses-feature android:name="android.hardware.touchscreen" android:required="false"/>\n    <uses-feature android:name="android.software.leanback" android:required="false"/>\n    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          if 'android:banner' not in s:
              s = s.replace('<application', '<application android:banner="@mipmap/ic_launcher"', 1)
          if 'LEANBACK_LAUNCHER' not in s:
              s = re.sub(r'(<category android:name="android.intent.category.LAUNCHER"\s*/>)',
                         r'\1\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>', s, count=1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Alfaham Box"', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)

          # Package name (applicationId) = app.alfaham.box
          for g in glob.glob('android/app/build.gradle*'):
              t = open(g, encoding='utf-8').read()
              t = re.sub(r'applicationId\s*=?\s*["\'][^"\']*["\']', 'applicationId = "app.alfaham.box"', t)
              open(g, 'w', encoding='utf-8').write(t)
              assert 'app.alfaham.box' in t, 'applicationId was not patched in ' + g

          assert 'android:label="Alfaham Box"' in open(p, encoding='utf-8').read(), 'app label was not patched'
          PY

      - run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build one universal APK (all devices, all CPU types)
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Show package name and CPU types inside the APK
        run: |
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -o 'lib/[^/]*/' | sort -u
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt dump badging build/app/outputs/flutter-apk/app-release.apk | grep -E "^package:|application-label:"

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/alfaham-box.apk

      - uses: actions/upload-artifact@v4
        with:
          name: alfaham-box-apk
          path: build/app/outputs/flutter-apk/alfaham-box.apk
